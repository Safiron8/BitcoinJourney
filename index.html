<!doctype html>
<html lang="cs" data-theme="dark">
    <head>
        <title>Cesta k ₿itcoinu</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Sleduj cestu ke svému bitcoinovému cíli krok po kroku."
        />
        <meta
            http-equiv="Content-Security-Policy"
            content="script-src 'self'; style-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'self'"
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Cesta k ₿itcoinu" />
        <meta
            property="og:description"
            content="Sleduj cestu ke svému bitcoinovému cíli krok po kroku."
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#191817" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="shell">
            <header class="intro">
                <div>
                    <h1>
                        <span data-i18n="headingBefore"></span><em data-i18n="bitcoinSymbol"></em
                        ><span data-i18n="headingAfter"></span>
                    </h1>
                    <p id="motivation" hidden></p>
                </div>
                <div class="intro-actions">
                    <button
                        class="theme-toggle"
                        id="theme-toggle"
                        type="button"
                        aria-pressed="true"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path
                                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
                            ></path>
                        </svg>
                    </button>
                    <div class="language-control">
                        <button
                            class="language-toggle"
                            id="language-toggle"
                            type="button"
                            aria-expanded="false"
                            aria-controls="language-menu"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="9" />
                                <path
                                    d="M3 12h18M12 3c-3 2.4-4.5 5.4-4.5 9s1.5 6.6 4.5 9M12 3c3 2.4 4.5 5.4 4.5 9S15 18.6 12 21"
                                />
                            </svg>
                        </button>
                        <div class="language-menu" id="language-menu" hidden></div>
                    </div>
                    <button class="settings-toggle" id="settings-toggle" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M10 2h4l.5 2.3 2 .8 1.9-1.3 2.8 2.8-1.3 1.9.8 2L23 11v4l-2.3.5-.8 2 1.3 1.9-2.8 2.8-1.9-1.3-2 .8L14 23h-4l-.5-2.3-2-.8-1.9 1.3-2.8-2.8 1.3-1.9-.8-2L1 15v-4l2.3-.5.8-2-1.3-1.9 2.8-2.8 1.9 1.3 2-.8z"
                            />
                            <circle cx="12" cy="12.5" r="3.2" />
                        </svg>
                    </button>
                </div>
            </header>

            <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
                <form class="settings-panel" id="settings-form" novalidate>
                    <div class="settings-head">
                        <h2 class="eyebrow" id="settings-title" data-i18n="settingsName"></h2>
                        <button class="settings-close" id="settings-close" type="button">
                            <span data-i18n="closeSymbol"></span>
                        </button>
                    </div>
                    <label class="settings-field">
                        <span data-i18n="goalField"></span>
                        <input
                            id="goal-input"
                            type="text"
                            inputmode="decimal"
                            maxlength="16"
                            pattern="([0-9]{1,7}([.,][0-9]{0,8})?|[.,][0-9]{1,8})"
                            aria-describedby="goal-error"
                            required
                        />
                    </label>
                    <p
                        class="goal-error"
                        id="goal-error"
                        data-i18n="goalInvalid"
                        role="alert"
                        hidden
                    ></p>
                    <label class="settings-field">
                        <span data-i18n="apiField"></span>
                        <input
                            id="api-url-input"
                            type="url"
                            inputmode="url"
                            spellcheck="false"
                            aria-describedby="api-error"
                            required
                        />
                    </label>
                    <p class="goal-error" id="api-error" role="alert" hidden></p>
                    <label class="settings-field">
                        <span data-i18n="motivationField"></span>
                        <input
                            id="motivation-input"
                            type="text"
                            maxlength="120"
                            autocomplete="off"
                        />
                    </label>
                    <div class="settings-direction">
                        <span
                            class="settings-direction-title"
                            id="animation-direction-label"
                            data-i18n="animationDirection"
                        ></span>
                        <label class="direction-switch">
                            <input
                                id="animation-direction-input"
                                type="checkbox"
                                role="switch"
                                aria-labelledby="animation-direction-label"
                                aria-describedby="animation-direction-help"
                            />
                            <span
                                class="direction-choice direction-horizontal"
                                data-i18n="animationHorizontal"
                            ></span>
                            <span class="direction-track" aria-hidden="true"></span>
                            <span
                                class="direction-choice direction-vertical"
                                data-i18n="animationVertical"
                            ></span>
                        </label>
                        <span
                            class="sr-only"
                            id="animation-direction-help"
                            data-i18n="animationDirectionHelp"
                        ></span>
                    </div>
                    <div class="settings-options">
                        <label class="settings-check"
                            ><input id="show-progress-input" type="checkbox" />
                            <span data-i18n="showProgress"></span
                        ></label>
                        <label class="settings-check"
                            ><input id="show-balance-input" type="checkbox" />
                            <span data-i18n="showBalance"></span
                        ></label>
                        <label class="settings-check"
                            ><input id="show-addresses-input" type="checkbox" />
                            <span data-i18n="showAddresses"></span
                        ></label>
                        <div class="presentation-option">
                            <label class="settings-check"
                                ><input id="presentation-mode-input" type="checkbox" />
                                <span data-i18n="presentationMode"></span
                            ></label>
                            <p class="settings-hint" data-i18n="presentationHint"></p>
                        </div>
                    </div>
                    <p class="settings-error" id="settings-error" role="alert" hidden></p>
                    <div class="settings-actions">
                        <button
                            class="settings-cancel"
                            id="settings-cancel"
                            type="button"
                            data-i18n="cancel"
                        ></button>
                        <button
                            class="settings-save"
                            type="submit"
                            data-i18n="saveSettings"
                        ></button>
                    </div>
                </form>
            </dialog>

            <main class="layout">
                <section class="visual">
                    <div class="visual-head">
                        <span class="visual-meta">
                            <span class="visual-goal" id="goal-label"></span>
                            <span
                                class="cache-status"
                                id="cache-status"
                                role="status"
                                hidden
                            ></span>
                        </span>
                        <span class="tile-counter"
                            ><b id="tile-count"></b><span data-i18n="countSeparator"></span
                            ><span id="tile-total"></span
                        ></span>
                    </div>
                    <div class="coin-stage" id="coin-stage"></div>
                    <div class="visual-footer">
                        <div class="legend">
                            <span class="legend-key">
                                <i class="legend-square" aria-hidden="true"></i>
                                <span id="tile-label"></span>
                            </span>
                        </div>
                        <button class="export" id="export" type="button" disabled>
                            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
                                <path d="M10 2v10m-3-3 3 3 3-3M3 12v5h14v-5" />
                            </svg>
                            <span data-i18n="saveImage"></span>
                        </button>
                    </div>
                </section>

                <aside class="summary" id="summary">
                    <section class="progress-section" id="progress-section" hidden>
                        <div class="eyebrow" data-i18n="progress"></div>
                        <div class="progress-number">
                            <span id="percentage"></span
                            ><span class="unit" data-i18n="percentUnit"></span>
                        </div>
                        <div class="progress-caption" id="progress-caption"></div>
                    </section>

                    <section
                        class="balance-section"
                        id="balance-section"
                        aria-labelledby="balance-label"
                        hidden
                    >
                        <div class="eyebrow" id="balance-label" data-i18n="balance"></div>
                        <div class="balance">
                            <span id="balance"></span><small data-i18n="btcUnit"></small>
                        </div>
                        <div class="sats" id="sats"></div>
                    </section>

                    <section
                        class="remaining-section"
                        id="remaining-section"
                        aria-labelledby="remaining-label"
                        hidden
                    >
                        <div class="eyebrow" id="remaining-label" data-i18n="remaining"></div>
                        <div class="remaining-value">
                            <span id="remaining"></span><small data-i18n="btcUnit"></small>
                        </div>
                        <div class="sats" id="remaining-sats"></div>
                    </section>
                    <section
                        class="addresses-inline"
                        id="addresses-section"
                        aria-labelledby="addresses-title"
                    >
                        <div class="addresses-head">
                            <div class="eyebrow" id="addresses-title" data-i18n="addresses"></div>
                            <span class="address-count" id="address-count"></span>
                        </div>
                        <form class="address-form" id="address-form">
                            <div class="address-input-wrap">
                                <input
                                    class="address-input"
                                    id="address-input"
                                    type="text"
                                    inputmode="text"
                                    autocomplete="off"
                                    spellcheck="false"
                                />
                                <button class="add-address" type="submit">
                                    <svg class="add-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M12 5v14M5 12h14" />
                                    </svg>
                                </button>
                            </div>
                        </form>
                        <ul class="address-list" id="address-list"></ul>
                        <p class="empty-state" id="empty-state" data-i18n="emptyState"></p>
                        <p class="message" id="message" role="status" hidden></p>
                    </section>
                </aside>
            </main>
            <footer class="site-footer">
                <span data-i18n="footerBeforeLink"></span>
                <span>
                    <a
                        id="api-link"
                        href="https://mempool.space"
                        target="_blank"
                        rel="noopener noreferrer"
                    ></a
                    ><span data-i18n="footerAfterLink"></span>
                </span>
            </footer>
        </div>

        <script type="module" src="script.js"></script>
    </body>
</html>
